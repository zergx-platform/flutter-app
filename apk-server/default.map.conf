# Serve the APK matching the requesting device's CPU architecture.
# User-Agent examples:
#   arm64-v8a: "Linux; Android 14; Pixel 8" — all modern phones
#   armeabi-v7a: 32-bit Android
#   x86_64: emulators / x86 tablets
# Default: arm64-v8a (covers virtually all real phones sold since 2018).
map $http_user_agent $apk_arch {
    default                                  arm64-v8a;
    "~*armeabi-v7a"                          armeabi-v7a;
    "~*armv[78]"                             armeabi-v7a;
    "~*x86_64|x86-64"                        x86_64;
    "~*\bx86\b"                              x86_64;
}
