server {
    listen       80;
    listen  [::]:80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Auto-download: /zergx-app-release.apk (legacy URL) or /download
    # redirect to the device-specific APK ($apk_arch comes from the UA map in
    # 00-arch-map.conf). Direct per-arch URLs stay for manual pick when
    # architecture detection fails.
    location = /zergx-app-release.apk {
        return 302 /zergx-$apk_arch-release.apk;
    }
    location = /download {
        return 302 /zergx-$apk_arch-release.apk;
    }

    location ~* ^/zergx-.+-release\.apk$ {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="$uri"';
        add_header Accept-Ranges bytes;
    }

    location / {
        autoindex on;
    }
}
